name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query every table (real Postgres activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y SUPABASE_KEY en Settings > Secrets and variables > Actions"
            exit 1
          fi
          fail=0
          for table in hermandades pasos news temples bands days posters admin_messages app_settings; do
            code=$(curl -sS -o /tmp/resp.txt -D /tmp/hdr.txt -w "%{http_code}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Prefer: count=exact" \
              "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=1")
            range=$(grep -i '^content-range:' /tmp/hdr.txt || true)
            echo "${table} -> ${code} ${range}"
            case "${code}" in
              200|206) ;;
              *) echo "::error::Fallo en ${table}: HTTP ${code}"; fail=1 ;;
            esac
          done
          if [ "${fail}" -ne 0 ]; then
            cat /tmp/resp.txt
            exit 1
          fi
          echo "OK: actividad registrada en todas las tablas"
